submission:
  title: "D2 Threat Intelligence Command Center"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Defence analysts receive thousands of alerts every day from SIEM systems,
    satellite feeds, cyber sensors, and intelligence reports in different
    formats. Manually correlating these alerts makes it difficult to
    distinguish genuine threats from false positives, while commanders need
    concise and prioritised threat assessments in BLUF format.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    We are building an AI-powered threat intelligence assistant that ingests
    and normalizes multi-source threat alerts, correlates related events into
    incidents, prioritises threats using explainable scoring, maps attacker
    behaviour to MITRE ATT&CK, and generates evidence-grounded BLUF summaries
    with recommended actions. IBM Bob is integrated into the solution workflow
    to support AI-assisted threat investigation and decision support.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Multi-source threat alert ingestion and normalization"
    - "Explainable correlation of related alerts into incidents"
    - "Threat prioritization with severity and confidence scoring"
    - "MITRE ATT&CK technique mapping with evidence"
    - "Evidence-grounded BLUF summaries and recommended actions"                           # optional 5th

  tech_stack:
    languages: ["Python","TypeScript"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI","React","Vite"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Bob","IBM watsonx.ai"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["SQLite"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["MITRE ATT&CK" , "REST API","Docker" , "GitHub Actions"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    Our strongest work is the evidence-grounded intelligence pipeline that
    transforms large volumes of noisy multi-source alerts into prioritised
    incidents, explains why alerts were correlated, maps attacker behaviour
    to MITRE ATT&CK, and produces concise BLUF summaries that help commanders
    understand what happened, why it matters, and what should be investigated.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    The prototype uses synthetic threat data and a focused MITRE ATT&CK
    mapping suitable for the demonstration rather than a complete production
    threat intelligence deployment. Some integrations and operational
    security controls are simplified for the hackathon environment.

